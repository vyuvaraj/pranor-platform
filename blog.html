<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pranor — Official Blog & Engineering Deep Dives</title>
  <meta name="description" content="Technical deep dives into the Pranor ecosystem: AI agent execution fabric, 6-level veto ladders, zero-CGO microservice architecture, and developer guides.">
  <meta property="og:title" content="Pranor Official Blog">
  <meta property="og:description" content="Technical deep dives, architecture guides, and tutorial series for Pranor v1.0 and v2.0.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vyuvaraj.github.io/pranor-platform/blog.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a26;
      --border: rgba(255,255,255,0.06);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --dim: #71717a;
      --accent: #818cf8;
      --accent-glow: rgba(129,140,248,0.15);
      --green: #34d399;
      --purple: #c084fc;
      --blue: #38bdf8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding-top:5.5rem; overflow-x:hidden; }
    
    /* Navigation Bar */
    nav { display:flex; justify-content:space-between; align-items:center; padding:1.2rem 2.5rem; border-bottom:1px solid var(--border); background:rgba(10,10,15,0.85); backdrop-filter:blur(12px); position:fixed; top:0; left:0; right:0; z-index:100; }
    .nav-brand { font-weight:800; font-size:1.1rem; text-decoration:none; color:var(--text); display:flex; align-items:center; gap:0.5rem; }
    .nav-links { display:flex; gap:1.6rem; list-style:none; align-items:center; }
    .nav-links a { color:var(--muted); text-decoration:none; font-size:0.88rem; font-weight:500; transition:color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color:var(--accent); }

    /* Page Header */
    .header-section { text-align:center; padding:3rem 2rem 2rem; max-width:900px; margin:0 auto; }
    .header-section h1 { font-size:clamp(2.2rem,4vw,3.5rem); font-weight:900; letter-spacing:-0.03em; margin-bottom:1rem; }
    .header-section p { color:var(--muted); font-size:1.1rem; }

    /* Blog Grid Container */
    .blog-container { max-width:1150px; margin:0 auto 5rem; padding:0 2rem; }
    .blog-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:1.5rem; }
    .blog-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.75rem; text-decoration:none; color:var(--text); transition:all 0.25s; display:flex; flex-direction:column; justify-content:space-between; }
    .blog-card:hover { border-color:var(--accent); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.4); }
    .card-badge { display:inline-flex; align-items:center; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; margin-bottom:1rem; width:fit-content; }
    .badge-purple { background:rgba(192,132,252,0.12); color:var(--purple); border:1px solid rgba(192,132,252,0.3); }
    .badge-blue { background:rgba(56,189,248,0.12); color:var(--blue); border:1px solid rgba(56,189,248,0.3); }
    .badge-green { background:rgba(52,211,153,0.12); color:var(--green); border:1px solid rgba(52,211,153,0.3); }
    .blog-card h3 { font-size:1.15rem; font-weight:700; margin-bottom:0.6rem; line-height:1.4; color:var(--text); }
    .blog-card p { font-size:0.88rem; color:var(--muted); line-height:1.55; margin-bottom:1.5rem; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color:var(--dim); font-family:'JetBrains Mono',monospace; border-top:1px solid var(--border); padding-top:0.8rem; }

    /* Single Article Reader View */
    .article-layout { display:grid; grid-template-columns:1fr 250px; gap:3rem; max-width:1150px; margin:0 auto 5rem; padding:0 2rem; }
    @media (max-width:900px) { .article-layout { grid-template-columns:1fr; } .article-toc { display:none; } }
    .article-body { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:2.5rem; line-height:1.8; color:var(--text); }
    .article-body h1 { font-size:2.2rem; font-weight:800; margin-bottom:1.2rem; letter-spacing:-0.02em; }
    .article-body h2 { font-size:1.5rem; font-weight:700; margin:2rem 0 1rem; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:0.5rem; }
    .article-body h3 { font-size:1.2rem; font-weight:600; margin:1.5rem 0 0.75rem; color:var(--text); }
    .article-body p { margin-bottom:1.2rem; color:#d4d4d8; font-size:0.98rem; }
    .article-body code { font-family:'JetBrains Mono',monospace; background:rgba(255,255,255,0.06); padding:0.2rem 0.4rem; border-radius:4px; font-size:0.88rem; color:var(--accent); }
    .article-body pre { background:#07070a; border:1px solid var(--border); border-radius:8px; padding:1.25rem; font-family:'JetBrains Mono',monospace; font-size:0.85rem; line-height:1.7; overflow-x:auto; margin:1.5rem 0; color:#e4e4e7; }
    .article-body ul, .article-body ol { margin-left:1.5rem; margin-bottom:1.5rem; color:#d4d4d8; }
    .article-body li { margin-bottom:0.4rem; }
    .article-body table { width:100%; border-collapse:collapse; margin:1.5rem 0; font-size:0.88rem; }
    .article-body th, .article-body td { border:1px solid var(--border); padding:0.6rem 0.8rem; text-align:left; }
    .article-body th { background:rgba(255,255,255,0.03); color:var(--accent); }
    
    .article-toc { position:sticky; top:7rem; max-height:80vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
    .article-toc h4 { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim); margin-bottom:0.75rem; }
    .article-toc a { display:block; font-size:0.82rem; color:var(--muted); text-decoration:none; padding:0.35rem 0; transition:color 0.2s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .article-toc a:hover { color:var(--accent); }

    .btn-back { display:inline-flex; align-items:center; gap:0.5rem; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.5rem 1rem; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:600; margin-bottom:1.5rem; transition:all 0.2s; }
    .btn-back:hover { border-color:var(--accent); color:var(--accent); }

    footer { padding:3rem 2rem; text-align:center; color:var(--dim); font-size:0.8rem; border-top:1px solid var(--border); }
    footer a { color:var(--muted); text-decoration:none; }
    footer a:hover { color:var(--accent); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">▲ Pranor Platform</a>
  <ul class="nav-links">
    <li><a href="index.html">Platform</a></li>
    <li><a href="features.html">Features Matrix</a></li>
    <li><a href="https://vyuvaraj.github.io/pranor/v2.0/" style="color:#c084fc; text-decoration:none; font-size:0.88rem; font-weight:700; background:rgba(192,132,252,0.12); padding:0.25rem 0.65rem; border-radius:6px; border:1px solid rgba(192,132,252,0.3);">✨ v2.0 AI Fabric</a></li>
    <li><a href="/pranor-platform/docs/">Docs</a></li>
    <li><a href="blog.html" class="active">Blog</a></li>
    <li><a href="vault.html">Vault</a></li>
    <li><a href="pulse.html">Pulse</a></li>
    <li><a href="gate.html">Gate</a></li>
    <li><a href="https://github.com/vyuvaraj/pranor">GitHub</a></li>
  </ul>
</nav>

<!-- Main Container (Switches between Catalog & Article Reader) -->
<div id="app"></div>

<footer>
  <p style="margin-bottom:0.5rem;">
    <a href="/pranor-platform/docs/">Docs</a> &middot;
    <a href="https://github.com/vyuvaraj/pranor">GitHub</a> &middot;
    <a href="https://github.com/vyuvaraj/pranor-ee">Enterprise</a>
  </p>
  <p>Built by <a href="https://github.com/vyuvaraj">vyuvaraj</a>. Licensed AGPL-3.0.</p>
</footer>

<script>
async function initBlog() {
  const app = document.getElementById('app');
  const urlParams = new URLSearchParams(window.location.search);
  const postName = urlParams.get('post');

  if (postName) {
    // Single Article Reader View
    await renderArticle(postName);
  } else {
    // Blog Catalog List View
    await renderCatalog();
  }
}

async function renderCatalog() {
  const app = document.getElementById('app');
  document.title = "Pranor — Official Blog & Engineering Deep Dives";

  const fallbackPosts = [
    { slug: "07-v2-ai-execution-fabric", title: "Pranor v2.0: Governed AI Agent Execution Fabric", excerpt: "6-level priority veto ladders, 3-tier virtual entity context graphs, episodic vector HNSW memory recall, and transactional agent sagas in pure Go.", badge: "AI Fabric", badgeColor: "purple", date: "2026-08-11", readingTime: "12 min" },
    { slug: "01-introducing-pranor", title: "Introducing Pranor: The Modular Backend Ecosystem", excerpt: "How a custom compiler, an S3 object store, a STOMP queue, an API gateway, and a glassmorphic console fit together.", badge: "Tutorial", badgeColor: "purple", date: "2026-07-10", readingTime: "6 min" },
    { slug: "02-getting-started-pranor", title: "Getting Started with Pranor in 10 Minutes", excerpt: "What if building a microservice was as simple as describing what it should do? Compile your first service.", badge: "Tutorial", badgeColor: "purple", date: "2026-07-10", readingTime: "10 min" },
    { slug: "03-api-gateway-pranor-gate", title: "Building a Production API Gateway with Pranor Gate", excerpt: "Sandboxed WASM middleware, PII redaction, prompt blocking, routing, and rate limiting at the edge.", badge: "Tutorial", badgeColor: "blue", date: "2026-07-10", readingTime: "12 min" },
    { slug: "04-caching-with-pranor-cache", title: "Distributed Caching Made Simple with Pranor Cache", excerpt: "Raft-based key-value caching, namespaces, clustering, invalidation patterns, and benchmark data.", badge: "Tutorial", badgeColor: "green", date: "2026-07-10", readingTime: "10 min" },
    { slug: "05-event-driven-pranor-pulse", title: "Event-Driven Microservices with Pranor Pulse", excerpt: "STOMP messaging, sliding-window dedup, DLQs, webhooks, and fan-out message routing.", badge: "Tutorial", badgeColor: "orange", date: "2026-07-10", readingTime: "12 min" },
    { slug: "06-fullstack-saas-pranor", title: "Full-Stack SaaS in Under an Hour with Pranor", excerpt: "A complete multi-tenant project management SaaS backend using 8+ Pranor components and docker-compose.", badge: "Tutorial", badgeColor: "purple", date: "2026-07-10", readingTime: "20 min" },
    { slug: "pranor-gate-medium-article", title: "A WebAssembly-Powered API Gateway With AI-Native Guards", excerpt: "Sandboxed WASM middleware, PII redaction, prompt blocking, and semantic caching at the edge.", badge: "Platform Layer", badgeColor: "blue", date: "2026-07-09", readingTime: "10 min" },
    { slug: "pranor-vault-medium-article", title: "An S3 Storage Engine With AI-Native Capabilities", excerpt: "Semantic search, time travel, erasure coding, and compute-near-data in one binary.", badge: "Infrastructure", badgeColor: "green", date: "2026-07-09", readingTime: "11 min" }
  ];

  let posts = fallbackPosts;
  try {
    const res = await fetch('blog/posts.json');
    if (res.ok) {
      posts = await res.json();
    }
  } catch (err) {
    console.warn("Using embedded fallback blog manifest:", err);
  }

  let gridHtml = `
    <div class="header-section">
      <h1>Engineering Blog & Tutorials</h1>
      <p>Deep dives into backend architecture, zero-CGO Go systems, and the Pranor v2.0 AI Execution Fabric.</p>
    </div>
    <div class="blog-container">
      <div class="blog-grid">
  `;

  posts.forEach(post => {
    let badgeClass = 'badge-blue';
    if (post.badgeColor === 'purple' || post.badge === 'AI Fabric') badgeClass = 'badge-purple';
    if (post.badgeColor === 'green') badgeClass = 'badge-green';

    gridHtml += `
      <a href="blog.html?post=${post.slug}" class="blog-card">
        <div>
          <span class="card-badge ${badgeClass}">${post.badge || 'Article'}</span>
          <h3>${post.title}</h3>
          <p>${post.excerpt}</p>
        </div>
        <div class="card-footer">
          <span>📅 ${post.date}</span>
          <span>📖 ${post.readingTime}</span>
        </div>
      </a>
    `;
  });

  gridHtml += `
      </div>
    </div>
  `;

  app.innerHTML = gridHtml;
}

async function renderArticle(postSlug) {
  const app = document.getElementById('app');
  const safeSlug = postSlug.replace(/[^a-zA-Z0-9_-]/g, '');

  try {
    const res = await fetch(`blog/${safeSlug}.md`);
    if (!res.ok) throw new Error('Article not found');
    const mdText = await res.text();
    const parsedHtml = marked.parse(mdText);

    app.innerHTML = `
      <div style="max-width:1150px; margin:2rem auto 0; padding:0 2rem;">
        <a href="blog.html" class="btn-back">← Back to All Articles</a>
      </div>
      <div class="article-layout">
        <article class="article-body" id="article-body">
          ${parsedHtml}
        </article>
        <aside class="article-toc">
          <h4>On This Page</h4>
          <div id="toc-links"></div>
        </aside>
      </div>
    `;

    // Set Document Title from first H1
    const h1 = document.querySelector('.article-body h1');
    if (h1) document.title = `${h1.textContent} — Pranor Blog`;

    // Generate Table of Contents
    const headings = document.querySelectorAll('.article-body h2');
    const tocLinks = document.getElementById('toc-links');
    headings.forEach((h, idx) => {
      const id = `heading-${idx}`;
      h.id = id;
      const a = document.createElement('a');
      a.href = `#${id}`;
      a.textContent = h.textContent;
      tocLinks.appendChild(a);
    });

  } catch (err) {
    app.innerHTML = `
      <div class="header-section">
        <div style="font-size:3rem; margin-bottom:1rem;">⚠️</div>
        <h1>Article Not Found</h1>
        <p style="margin-bottom:2rem;">The requested article "${safeSlug}" could not be found.</p>
        <a href="blog.html" class="btn-back">← Return to Blog Catalog</a>
      </div>
    `;
  }
}

window.addEventListener('DOMContentLoaded', initBlog);
</script>
</body>
</html>
