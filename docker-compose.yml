services:
  # ─── OBSERVABILITY ───────────────────────────────────────────────────────────

  # 1. Jaeger — Distributed OTel Traces (fallback/comparison alongside Pranor Trace)
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - pranor-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Pranor Trace — Native OTLP/HTTP collector & trace API
  pranor-trace:
    build:
      context: ../pranor/trace
    ports:
      - "8090:8090"
    networks:
      - pranor-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── INFRASTRUCTURE ──────────────────────────────────────────────────────────

  # 3. Pranor Vault — S3-compatible Object Storage
  pranor-vault:
    build:
      context: ../pranor/vault
    ports:
      - "8081:8081"
    command: ["--port", "8081", "--data-dir", "/data"]
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Pranor Pulse — Message Broker (HTTP + STOMP)
  pranor-pulse:
    build:
      context: ../pranor/pulse
    ports:
      - "8082:8082"   # HTTP Admin API
      - "61613:61613" # STOMP TCP
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Pranor Cache — Distributed Cache (memory or Redis backend)
  pranor-cache:
    build:
      context: ../pranor/cache
    ports:
      - "8086:8086"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── PLATFORM ────────────────────────────────────────────────────────────────

  # 6. Pranor Gate — API Gateway
  pranor-gate:
    build:
      context: ../pranor/gate
    ports:
      - "8080:8080"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 7. Pranor Mesh — Service Mesh Registry
  pranor-mesh:
    build:
      context: ../pranor/mesh
    ports:
      - "8089:8089"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 8. Pranor Chrono — Distributed Scheduler
  pranor-chrono:
    build:
      context: ../pranor/chrono
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 9. Pranor Deploy — Deployment Orchestrator
  pranor-deploy:
    build:
      context: ../pranor/deploy
    ports:
      - "8085:8085"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
      pranor-gate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 10. Pranor Tunnel — Tunnel Relay Server
  pranor-tunnel:
    build:
      context: ../pranor/tunnel
    ports:
      - "8443:8443"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MANAGEMENT ──────────────────────────────────────────────────────────────

  # 11. Pranor Console — Observability Dashboard
  pranor-console:
    build:
      context: ../pranor/console
    ports:
      - "8083:8083"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
      - PRANOR_DISCOVERY={"gate":"http://pranor-gate:8080","vault":"http://pranor-vault:8081","pulse":"http://pranor-pulse:8082","cache":"http://pranor-cache:8086","chrono":"http://pranor-chrono:8087","mesh":"http://pranor-mesh:8089","deploy":"http://pranor-deploy:8085","tunnel":"http://pranor-tunnel:8443","trace":"http://pranor-trace:8090","hub":"http://pranor-hub:8088","otlp_endpoint":"http://jaeger:4318","auth":"http://pranor-auth:8098","pool":"http://pranor-pool:8097","notify":"http://pranor-notify:8094","flow":"http://pranor-flow:8096"}
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
      pranor-vault:
        condition: service_healthy
      pranor-pulse:
        condition: service_healthy
      pranor-gate:
        condition: service_healthy
      pranor-cache:
        condition: service_healthy
      pranor-chrono:
        condition: service_healthy
      pranor-mesh:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── ECOSYSTEM ───────────────────────────────────────────────────────────────

  # 12. Pranor Hub — Package Registry
  pranor-hub:
    build:
      context: ../pranor/hub
    ports:
      - "8088:8088"
    environment:
      - PRANOR_STORE_ENDPOINT=http://pranor-vault:8081
      - PRANOR_STORE_ACCESS_KEY=admin
      - PRANOR_STORE_SECRET_KEY=admin123
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
    networks:
      - pranor-net
    depends_on:
      pranor-vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 13. Pranor Auth — Authentication Service
  pranor-auth:
    build:
      context: ../pranor/auth
    ports:
      - "8098:8098"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
      - PRANOR_DISCOVERY={"gate":"http://pranor-gate:8080","vault":"http://pranor-vault:8081","pulse":"http://pranor-pulse:8082","cache":"http://pranor-cache:8086","chrono":"http://pranor-chrono:8087","mesh":"http://pranor-mesh:8089","deploy":"http://pranor-deploy:8085","tunnel":"http://pranor-tunnel:8443","trace":"http://pranor-trace:8090","hub":"http://pranor-hub:8088","otlp_endpoint":"http://jaeger:4318","auth":"http://pranor-auth:8098","pool":"http://pranor-pool:8097","notify":"http://pranor-notify:8094","flow":"http://pranor-flow:8096"}
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
      pranor-vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8098/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 14. Pranor Pool — Database Connection Pool Manager
  pranor-pool:
    build:
      context: ../pranor/pool
    ports:
      - "8097:8097"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
      - PRANOR_DISCOVERY={"gate":"http://pranor-gate:8080","vault":"http://pranor-vault:8081","pulse":"http://pranor-pulse:8082","cache":"http://pranor-cache:8086","chrono":"http://pranor-chrono:8087","mesh":"http://pranor-mesh:8089","deploy":"http://pranor-deploy:8085","tunnel":"http://pranor-tunnel:8443","trace":"http://pranor-trace:8090","hub":"http://pranor-hub:8088","otlp_endpoint":"http://jaeger:4318","auth":"http://pranor-auth:8098","pool":"http://pranor-pool:8097","notify":"http://pranor-notify:8094","flow":"http://pranor-flow:8096"}
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
      pranor-vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8097/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 15. Pranor Notify — Notification Gateway
  pranor-notify:
    build:
      context: ../pranor/notify
    ports:
      - "8094:8094"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
      - PRANOR_DISCOVERY={"gate":"http://pranor-gate:8080","vault":"http://pranor-vault:8081","pulse":"http://pranor-pulse:8082","cache":"http://pranor-cache:8086","chrono":"http://pranor-chrono:8087","mesh":"http://pranor-mesh:8089","deploy":"http://pranor-deploy:8085","tunnel":"http://pranor-tunnel:8443","trace":"http://pranor-trace:8090","hub":"http://pranor-hub:8088","otlp_endpoint":"http://jaeger:4318","auth":"http://pranor-auth:8098","pool":"http://pranor-pool:8097","notify":"http://pranor-notify:8094","flow":"http://pranor-flow:8096"}
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
      pranor-vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8094/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 16. Pranor Flow — Workflow Orchestrator
  pranor-flow:
    build:
      context: ../pranor/flow
    ports:
      - "8096:8096"
    environment:
      - PRANOR_OTLP_ENDPOINT=http://pranor-trace:8090
      - PRANOR_DISCOVERY={"gate":"http://pranor-gate:8080","vault":"http://pranor-vault:8081","pulse":"http://pranor-pulse:8082","cache":"http://pranor-cache:8086","chrono":"http://pranor-chrono:8087","mesh":"http://pranor-mesh:8089","deploy":"http://pranor-deploy:8085","tunnel":"http://pranor-tunnel:8443","trace":"http://pranor-trace:8090","hub":"http://pranor-hub:8088","otlp_endpoint":"http://jaeger:4318","auth":"http://pranor-auth:8098","pool":"http://pranor-pool:8097","notify":"http://pranor-notify:8094","flow":"http://pranor-flow:8096"}
    networks:
      - pranor-net
    depends_on:
      pranor-trace:
        condition: service_healthy
      pranor-vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8096/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  pranor-net:
    driver: bridge
