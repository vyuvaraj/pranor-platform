# Pranorverse Meta-Package GoReleaser Config
#
# Generates a virtual `pranorverse` .deb/.rpm meta-package that declares all
# 16 Pranor pranorices as dependencies. Users can run:
#   apt install pranorverse
#   dnf install pranorverse
# and get the full stack installed.
#
# This config has NO build section (no binary to compile). It only produces
# nfpm packages via the `nfpms` block.
#
# Usage:
#   goreleaser release --config .goreleaser-meta.yml --snapshot --clean
#   goreleaser release --config .goreleaser-meta.yml

version: 2

project_name: pranorverse

# No builds — this is a pure meta-package (virtual package with dependencies only)
builds:
  - skip: true
    id: skip-build

nfpms:
  - id: pranorverse-meta
    package_name: pranorverse
    # No binary to install — this is a dependency-only meta-package
    builds: []
    vendor: Yuvaraj
    homepage: https://github.com/vyuvaraj/pranorverse-repo
    maintainer: Yuvaraj <vyuvaraj@github.com>
    description: |
      Pranorverse ecosystem meta-package.
      Installing this package will install the complete Pranorverse platform:
      Pranor-lang compiler, PranorGate, PranorStore, PranorQueue, PranorCache, PranorMesh,
      PranorConsole, PranorTrace, PranorAuth, PranorCron, PranorCloud, PranorFlow,
      PranorPool, PranorMail, PranorTunnel, PranorRegistry, and PranorLock.
    license: Apache-2.0
    formats:
      - deb
      - rpm

    # Virtual package — declares all 16 pranorice packages as dependencies.
    # Each pranorice publishes its own .deb/.rpm via its own GoReleaser config.
    dependencies:
      - pranor-lang
      - pranorgate
      - pranorstore
      - pranorqueue
      - pranorcache
      - pranormesh
      - pranorconsole
      - pranortrace
      - pranorauth
      - pranorcron
      - pranorcloud
      - pranorflow
      - pranorpool
      - pranormail
      - pranortunnel
      - pranorregistry
      - pranorlock

    contents:
      - src: scripts/postinstall-meta.sh
        dst: /usr/share/doc/pranorverse/postinstall.sh
        type: doc

    scripts:
      postinstall: scripts/postinstall-meta.sh
      preremove: scripts/preremove-meta.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
