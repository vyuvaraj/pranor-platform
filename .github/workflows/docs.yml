name: Deploy Documentation (SEO & Sitemap)

# =============================================================================
# Pranor Platform SEO-Optimized Documentation Pipeline
#
# Builds mdBook documentation for GitHub Pages:
#   - Automated sitemap.xml generation
#   - SEO robots.txt
#   - OpenGraph & Twitter Cards
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Build mdBook Documentation
        run: |
          mdbook build docs/

      - name: Generate SEO robots.txt and sitemap.xml
        run: |
          # 1. Create robots.txt
          cat << 'EOF' > docs/_site/robots.txt
          User-agent: *
          Allow: /
          Sitemap: https://vyuvaraj.github.io/pranor-platform/sitemap.xml
          EOF

          # 2. Generate XML Sitemap
          cat << 'EOF' > docs/_site/sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://vyuvaraj.github.io/pranor-platform/</loc>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
          EOF

          # Dynamically append all generated .html pages to sitemap
          cd docs/_site
          find . -name "*.html" | sort | while read -r file; do
            clean_path=$(echo "$file" | sed 's|^\./||')
            if [ "$clean_path" != "index.html" ]; then
              echo "  <url>" >> sitemap.xml
              echo "    <loc>https://vyuvaraj.github.io/pranor-platform/${clean_path}</loc>" >> sitemap.xml
              echo "    <changefreq>weekly</changefreq>" >> sitemap.xml
              echo "    <priority>0.8</priority>" >> sitemap.xml
              echo "  </url>" >> sitemap.xml
            fi
          done
          echo "</urlset>" >> sitemap.xml
          cd ../..

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
