name: Deploy Platform Marketing Site & Documentation (SEO & Sitemap)

# =============================================================================
# Pranor Platform Site & SEO-Optimized Documentation Pipeline
#
# Deploys:
#   - /                              -> Root Marketing Landing Page (index.html)
#   - /docs/                         -> Technical mdBook Documentation
#   - sitemap.xml & robots.txt       -> SEO Crawling Index
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.html'
      - 'styles.css'
      - '*.html'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Build mdBook Technical Documentation
        run: |
          # Build mdBook into docs/_site
          sed -i 's|site-url = "/pranor-platform/"|site-url = "/pranor-platform/docs/"|g' docs/book.toml
          mdbook build docs/

      - name: Prepare Root Marketing Site & Subdirectory Documentation
        run: |
          mkdir -p site_out
          # 1. Copy marketing landing page assets to site_out root
          cp index.html site_out/ 2>/dev/null || true
          cp styles.css site_out/ 2>/dev/null || true
          cp *.html site_out/ 2>/dev/null || true
          cp arch-diagram.svg site_out/ 2>/dev/null || true

          # 2. Copy technical mdBook documentation into site_out/docs/
          mkdir -p site_out/docs
          cp -r docs/_site/* site_out/docs/

      - name: Generate SEO robots.txt and sitemap.xml
        run: |
          # 1. Create robots.txt
          cat << 'EOF' > site_out/robots.txt
          User-agent: *
          Allow: /
          Sitemap: https://vyuvaraj.github.io/pranor-platform/sitemap.xml
          EOF

          # 2. Generate XML Sitemap
          cat << 'EOF' > site_out/sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://vyuvaraj.github.io/pranor-platform/</loc>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://vyuvaraj.github.io/pranor-platform/docs/</loc>
              <changefreq>daily</changefreq>
              <priority>0.9</priority>
            </url>
          EOF

          # Dynamically append all generated .html pages to sitemap
          cd site_out
          find docs -name "*.html" | sort | while read -r file; do
            clean_path=$(echo "$file" | sed 's|^\./||')
            echo "  <url>" >> sitemap.xml
            echo "    <loc>https://vyuvaraj.github.io/pranor-platform/${clean_path}</loc>" >> sitemap.xml
            echo "    <changefreq>weekly</changefreq>" >> sitemap.xml
            echo "    <priority>0.8</priority>" >> sitemap.xml
            echo "  </url>" >> sitemap.xml
          done
          echo "</urlset>" >> sitemap.xml
          cd ..

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
