name: pranorverse
version: '1.7.0'
summary: Unified developer platform ecosystem
description: |
  PranorVerse provides a complete micropranorice developer toolkit: compiler, API Gateway, S3 storage, broker, trace collector and more.
confinement: strict
base: core22

apps:
  compiler:
    command: bin/pranor
    plugs: [home, network]
  gateway:
    command: bin/pranorgate
    plugs: [network, network-bind]
  store:
    command: bin/pranorstore
    plugs: [network, network-bind]
  queue:
    command: bin/pranorqueue
    plugs: [network, network-bind]
  console:
    command: bin/pranorconsole
    plugs: [network, network-bind]

parts:
  binaries:
    plugin: dump
    source: .
    organize:
      pranor: bin/pranor
      pranorgate: bin/pranorgate
      pranorstore: bin/pranorstore
      pranorqueue: bin/pranorqueue
      pranorconsole: bin/pranorconsole
